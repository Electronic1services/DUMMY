/* ============ LIVE LOCATION TRACKING (continuous "you are here" dot) ============ */
let watchId = null;
let liveMarker = null;
let followMe = true;

function liveIcon(){
  return L.divIcon({
    className:'',
    html:'<div class="live-dot-wrap"><div class="live-dot-pulse"></div><div class="live-dot-core"></div></div>',
    iconSize:[26,26], iconAnchor:[13,13]
  });
}

function onPosition(pos){
  const latlng = [pos.coords.latitude, pos.coords.longitude];
  if(!liveMarker){
    liveMarker = L.marker(latlng, { icon: liveIcon(), zIndexOffset: 1000 }).addTo(map);
  } else {
    liveMarker.setLatLng(latlng);
  }
  if(followMe) map.setView(latlng, Math.max(map.getZoom(), 16));
}

function onPositionError(err){
  alert('تعذر تحديد موقعك، تأكد من تفعيل خدمة الموقع. (' + (err.message || '') + ')');
  stopTracking();
}

function startTracking(){
  if(!navigator.geolocation){ alert('المتصفح لا يدعم تحديد الموقع'); return; }
  followMe = true;
  watchId = navigator.geolocation.watchPosition(onPosition, onPositionError, {
    enableHighAccuracy:true, maximumAge:2000, timeout:15000
  });
  document.getElementById('locateBtn').classList.add('tracking');
}

function stopTracking(){
  if(watchId !== null){ navigator.geolocation.clearWatch(watchId); watchId = null; }
  document.getElementById('locateBtn').classList.remove('tracking');
}

document.getElementById('locateBtn').addEventListener('click', () => {
  if(watchId === null) startTracking(); else stopTracking();
});

map.on('dragstart', () => { if(watchId !== null) followMe = false; });
