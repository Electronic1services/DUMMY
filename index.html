const map=L.map('map').setView([26.05,40.65],10);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'Esri'}).addTo(map);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:20}).addTo(map);
let current=null,filter='all',latest={},markers={};
function meterKey(m){return (m.meter && String(m.meter).trim()) ? String(m.meter).trim() : 'ACC-'+String(m.account||'').trim();}const valid=METERS.filter(m=>m.lat&&m.lng);document.getElementById('count').textContent='('+valid.length+')';document.getElementById('allC').textContent=valid.length;document.getElementById('coordInfo').textContent='العدادات المعتمدة على الخريطة: '+valid.length;
function icon(s){let c=s==='تم تحديثه'?'#1d8a4a':s==='لم يتم تحديثه'?'#c23b3b':'#d97b1f';return L.divIcon({className:'',html:'<div style="width:22px;height:22px;border-radius:50%;background:'+c+';border:3px solid white;box-shadow:0 1px 5px #0008"></div>',iconSize:[22,22],iconAnchor:[11,11]})}
valid.forEach(m=>{let mk=L.marker([m.lat,m.lng],{icon:icon(null)}).addTo(map).on('click',()=>openMeter(m));markers[meterKey(m)]=mk});
async function loadLatest(){latest={};if(db){try{let s=await db.collection('dummy_meter_updates').get();s.forEach(d=>{let x=d.data();let k=meterKey(x);if(!latest[k]||String(x.createdAt||'')>String(latest[k].createdAt||''))latest[k]=x})}catch(e){console.warn(e)}}else{latest=JSON.parse(localStorage.getItem('dummy_notes_latest')||'{}')}refresh()}
function refresh(){let d=0,n=0;valid.forEach(m=>{let s=latest[meterKey(m)]?.noteStatus;if(s==='تم تحديثه')d++;else if(s==='لم يتم تحديثه')n++;if(markers[meterKey(m)])markers[meterKey(m)].setIcon(icon(s))});document.getElementById('doneC').textContent=d;document.getElementById('notC').textContent=n;document.getElementById('noneC').textContent=0;applyFilter()}
function applyFilter(){valid.forEach(m=>{let s=latest[meterKey(m)]?.noteStatus;let show=filter==='all'||s===filter;let mk=markers[meterKey(m)];if(show&&!map.hasLayer(mk))mk.addTo(map);if(!show&&map.hasLayer(mk))map.removeLayer(mk)})}
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;applyFilter()});
function openMeter(m){current=m;document.getElementById('mTitle').textContent='عداد '+(m.meter||'بدون رقم عداد');let coord=m.lat&&m.lng?(m.lat.toFixed(7)+', '+m.lng.toFixed(7)):'لا توجد إحداثيات صالحة';document.getElementById('mMeta').innerHTML='<b>رقم الحساب:</b> '+esc(m.account)+'<br><b>اسم العميل:</b> '+esc(m.name)+'<br><b>الفرع:</b> '+esc(m.branch)+'<br><b>فئة العميل:</b> '+esc(m.class)+'<br><b>رقم العداد:</b> '+esc(m.meter||'—')+'<br><b>حالة العداد:</b> '+esc(m.status||'—')+'<br><b>X:</b> '+esc(m.x||'—')+'<br><b>Y:</b> '+esc(m.y||'—')+'<br><b>XYZ:</b> '+esc(m.xyz||'—')+'<br><b>الإحداثيات المستخدمة:</b> '+esc(coord)+(m.coordSource?' <small>('+esc(m.coordSource)+')</small>':'');let nav=document.getElementById('googleNav');if(m.lat&&m.lng){nav.href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(m.lat+','+m.lng);nav.style.display='block'}else{nav.removeAttribute('href');nav.style.display='none'}let key=meterKey(m);let x=latest[key];document.getElementById('noteStatus').value=x?.noteStatus||'';document.getElementById('noteText').value='';document.getElementById('last').innerHTML=x?'<div class="entry"><span class="badge '+(x.noteStatus==='تم تحديثه'?'done':'notdone')+'">'+x.noteStatus+'</span><br>'+esc(x.text||'')+'<br><small>'+esc(x.employee||'')+' - '+esc(x.createdAt||'')+'</small></div>':'<div class="entry">لا يوجد تسجيل سابق</div>';document.getElementById('sheet').classList.add('open')}
document.getElementById('close').onclick=()=>document.getElementById('sheet').classList.remove('open');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('reportBtn').onclick=async()=>{
  const btn=document.getElementById('reportBtn');
  const old=btn.textContent; btn.disabled=true; btn.textContent='⏳ جاري تجهيز التقرير...';
  try{
    await loadLatest();
    const rows=valid.map(m=>{
      const r=latest[meterKey(m)]||{};
      return {
        'ACCOUNT ID':m.account||'',
        'CUSTOMER NAME':m.name||'',
        'BRANCH NAME':m.branch||'',
        'CUSTOMER CLASS':m.class||'',
        'METER ID':m.meter||'',
        'METER STATUS':m.status||'',
        'X':m.x||'',
        'Y':m.y||'',
        'XYZ':m.xyz||'',
        'LATITUDE':m.lat||'',
        'LONGITUDE':m.lng||'',
        'مصدر الإحداثيات':m.coordSource||'',
        'حالة التحديث':r.noteStatus||'',
        'ملاحظات الموظف':r.text||'',
        'اسم الموظف':r.employee||'',
        'تاريخ ووقت التسجيل':r.createdAt||''
      };
    });
    const ws=XLSX.utils.json_to_sheet(rows);
    ws['!cols']=[{wch:16},{wch:30},{wch:16},{wch:16},{wch:18},{wch:14},{wch:16},{wch:16},{wch:28},{wch:16},{wch:16},{wch:18},{wch:18},{wch:35},{wch:20},{wch:24}];
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'تقرير العدادات');
    const now=new Date();
    const stamp=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
    XLSX.writeFile(wb,'DUMMY_384_Report_'+stamp+'.xlsx');
  }catch(e){alert('تعذر إنشاء التقرير: '+e.message)}
  finally{btn.disabled=false;btn.textContent=old}
};
document.getElementById('save').onclick=async()=>{if(!current)return;let employee=document.getElementById('emp').value.trim(),noteStatus=document.getElementById('noteStatus').value,text=document.getElementById('noteText').value.trim();if(!employee){alert('اكتب اسم الموظف أولاً');return}if(!noteStatus){alert('اختر تم تحديثه أو لم يتم تحديثه');return}let key=meterKey(current);let rec={meter:current.meter,account:current.account,name:current.name,branch:current.branch,customerClass:current.class,meterStatus:current.status,x:current.x,y:current.y,xyz:current.xyz,lat:current.lat,lng:current.lng,coordSource:current.coordSource,noteStatus,text,employee,createdAt:new Date().toLocaleString('ar-SA')};try{if(db)await db.collection('dummy_meter_updates').add(rec);latest[key]=rec;if(!db)localStorage.setItem('dummy_notes_latest',JSON.stringify(latest));document.getElementById('msg').textContent='تم الحفظ ✓';openMeter(current);refresh()}catch(e){alert('تعذر الحفظ: '+e.message)}};
const q=document.getElementById('q'),res=document.getElementById('results');q.oninput=()=>{let v=q.value.trim();if(!v){res.style.display='none';return}let a=valid.filter(m=>(m.meter+' '+m.account+' '+m.branch+' '+m.name).includes(v)).slice(0,50);res.innerHTML=a.map((m,i)=>'<div class="item" data-i="'+valid.indexOf(m)+'"><b>'+m.meter+'</b> — '+m.branch+'<br><small>الحساب '+m.account+' | '+(latest[meterKey(m)]?.noteStatus||'غير مسجل')+'</small></div>').join('')||'<div class="item">لا توجد نتائج</div>';res.style.display='block';res.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{let m=valid[+x.dataset.i];res.style.display='none';q.value='';if(m.lat&&m.lng)map.setView([m.lat,m.lng],18);openMeter(m)})};
