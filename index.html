<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>خريطة العدادات غير المحدثة</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
html,body,#app{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
body{background:#f4f6f5;color:#172522}
#app{display:flex;flex-direction:column}
.top{background:#0b3d3d;color:#fff;padding:10px;z-index:1000;box-shadow:0 3px 14px #0003}
.r{display:flex;gap:7px;align-items:center}
.title{font-weight:800;flex:1;font-size:14px}
.small{font-size:11px;opacity:.8}
input,select,textarea,button{font:inherit}
.top input{border:0;border-radius:9px;padding:9px;width:135px}
.search{margin-top:8px}
.search input{width:100%}
.stats{display:flex;gap:6px;margin-top:8px;overflow:auto}
.chip{border:1px solid #ffffff55;background:#155e5e;color:#fff;border-radius:18px;padding:6px 10px;white-space:nowrap;font-size:12px;display:flex;align-items:center;gap:5px}
.chip.active{outline:2px solid #fff}
.chip .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.region-picker{position:relative;margin-top:8px}
.region-toggle{width:100%;padding:9px;border:0;border-radius:9px;background:#fff;color:#0b3d3d;font-weight:800}
.region-menu{display:none;position:absolute;z-index:1500;top:42px;right:0;left:0;background:#fff;color:#172522;border-radius:12px;box-shadow:0 6px 22px #0004;max-height:42vh;overflow:auto;padding:8px}
.region-menu.open{display:block}
.region-option{display:flex;align-items:center;gap:8px;padding:7px;border-bottom:1px solid #eee}
.region-option input{width:18px;height:18px}
.region-actions{display:flex;gap:6px;position:sticky;top:0;background:#fff;padding:4px 0 8px}
.region-actions button{flex:1;padding:7px;border:0;border-radius:8px;background:#155e5e;color:#fff}
.main{position:relative;flex:1;min-height:0}
#map{height:100%;width:100%;background:#ddd}
.results{position:absolute;top:8px;right:8px;left:8px;z-index:900;background:#fff;border-radius:12px;max-height:45%;overflow:auto;display:none;box-shadow:0 6px 22px #0004}
.item{padding:9px;border-bottom:1px solid #eee}
.item b{color:#0b3d3d}
.item .tag{display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:10px;color:#fff;margin-left:4px}
.sheet{position:fixed;z-index:2000;right:8px;left:8px;bottom:8px;background:#fff;border-radius:18px;padding:14px;box-shadow:0 0 30px #0005;max-height:82vh;overflow:auto;display:none}
.sheet.open{display:block}
.close{float:left;border:0;background:#eee;border-radius:50%;width:32px;height:32px}
.meta{font-size:12px;color:#667;line-height:2}
.field{margin-top:10px}
.field label{display:block;font-weight:700;font-size:12px;margin-bottom:4px}
.field select,.field textarea{width:100%;padding:10px;border:1px solid #ccd4d1;border-radius:10px;background:#fff}
.field textarea{min-height:65px}
.save{width:100%;margin-top:10px;padding:11px;border:0;border-radius:10px;background:#d97b1f;color:#fff;font-weight:800}
.reportBtn{display:block;width:100%;padding:9px;border-radius:10px;background:#fff;color:#0b3d3d;font-weight:800;text-align:center;text-decoration:none}
.nav{display:block;width:100%;margin-top:10px;padding:11px;border:0;border-radius:10px;background:#1976d2;color:#fff;font-weight:800;text-align:center;text-decoration:none}
.log{margin-top:12px}
.entry{background:#f5f6f4;border-right:4px solid #1d8a8a;border-radius:9px;padding:8px;margin-top:6px;font-size:12px}
.badge{display:inline-block;padding:3px 7px;border-radius:12px;color:#fff;font-weight:700}
.done{background:#1d8a4a}
.notdone{background:#c23b3b}
.statusPill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.statusPill.on{background:#1d8a4a;color:#fff}
.statusPill.off{background:#9e9e9e;color:#fff}
.noCoord{position:absolute;bottom:10px;left:10px;z-index:700;background:#fff;padding:7px;border-radius:9px;font-size:11px;box-shadow:0 2px 10px #0002}
#locateBtn{position:absolute;bottom:16px;right:10px;z-index:900;width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 2px 10px #0004;border:none;display:flex;align-items:center;justify-content:center;font-size:20px}
#locateBtn.tracking{background:#1d6fd9;color:#fff}
.live-dot-wrap{position:relative;width:26px;height:26px}
.live-dot-pulse{position:absolute;top:50%;left:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:rgba(29,111,217,.35);animation:liveDotPulse 1.8s ease-out infinite}
@keyframes liveDotPulse{0%{transform:scale(0.4);opacity:.9}100%{transform:scale(2.2);opacity:0}}
.live-dot-core{position:absolute;top:50%;left:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#1d6fd9;border:3px solid #fff;box-shadow:0 1px 5px #0007}
.missingPanel{position:fixed;z-index:2000;right:8px;left:8px;bottom:8px;top:8px;background:#fff;border-radius:18px;padding:14px;box-shadow:0 0 30px #0005;overflow:auto;display:none}
.missingPanel.open{display:block}
.missRow{background:#f5f6f4;border-radius:12px;padding:10px;margin-bottom:10px}
.missRow .nm{font-weight:800;color:#0b3d3d;font-size:13px}
.missRow .sub{font-size:11.5px;color:#667;margin-top:4px;line-height:1.8}
.missRow button{margin-top:8px;width:100%;padding:9px;border:0;border-radius:9px;background:#0f7a43;color:#fff;font-weight:800}
.missRow.captured{opacity:.55}
.missRow.captured button{background:#9e9e9e}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="r">
      <div class="title">📋 العدادات غير المحدثة <span class="small" id="count"></span></div>
      <input id="emp" placeholder="اسم الموظف">
    </div>
    <div class="search"><input id="q" placeholder="ابحث برقم العداد / الحساب / المنطقة / الفرع"></div>
    <div class="region-picker">
      <button id="regionToggle" class="region-toggle" type="button">📍 كل المناطق</button>
      <div id="regionMenu" class="region-menu">
        <div class="region-actions">
          <button id="selectAllRegions" type="button">اختيار الكل</button>
          <button id="clearRegions" type="button">إلغاء الكل</button>
        </div>
        <div id="regionOptions"></div>
      </div>
    </div>
    <div style="margin-top:8px;display:flex;gap:8px">
      <button id="reportBtn" class="reportBtn" type="button" style="flex:1">📊 تحميل التقرير المحدث</button>
      <button id="missingBtn" class="reportBtn" type="button" style="flex:1">📍 بدون إحداثيات <span id="missingCount"></span></button>
    </div>

    <div class="stats">
      <button class="chip active" data-f="all">الكل <span id="allC"></span></button>
      <button class="chip" data-f="done"><span class="dot" style="background:#1d8a4a"></span>تم تحديثه <span id="doneC">0</span></button>
      <button class="chip" data-f="notdone"><span class="dot" style="background:#c23b3b"></span>لم يتم تحديثه <span id="notC">0</span></button>
    </div>
  </div>

  <div class="main">
    <div id="map"></div>
    <div class="results" id="results"></div>
    <div class="noCoord" id="coordInfo"></div>
    <button id="locateBtn" title="تتبّع موقعي">🎯</button>
  </div>
</div>

<div class="missingPanel" id="missingPanel">
  <button class="close" id="closeMissing">×</button>
  <h3 style="margin:0 0 6px">📍 عدادات بدون إحداثيات صالحة</h3>
  <p style="font-size:12.5px;color:#667;margin:0 0 12px">هذي القائمة للعدادات اللي ما فيها إحداثيات مسجّلة. لما توصل موقع أي عداد منها ميدانيًا، اضغط "استخدم موقعي الآن" لتسجيل إحداثياته فورًا.</p>
  <div id="missingList"></div>
</div>

<div class="sheet" id="sheet">
  <button class="close" id="close">×</button>
  <h3 id="mTitle" style="margin:0 0 6px"></h3>
  <div class="meta" id="mMeta"></div>
  <a id="googleNav" class="nav" href="#" target="_blank" rel="noopener">📍 الانتقال إلى موقع العداد عبر Google Maps</a>

  <div class="field">
    <label>الملاحظة *</label>
    <select id="noteStatus">
      <option value="">اختر...</option>
      <option>تم تحديثه</option>
      <option>لم يتم تحديثه</option>
    </select>
  </div>
  <div class="field">
    <label>ملاحظات إضافية</label>
    <textarea id="noteText" placeholder="اكتب ملاحظة إضافية إن وجدت..."></textarea>
  </div>
  <button class="save" id="save">💾 حفظ</button>
  <div id="msg" style="text-align:center;margin-top:6px;font-size:12px"></div>

  <div class="log">
    <b>آخر تسجيل</b>
    <div id="last"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

let current = null, statusFilter = 'all', latest = {}, markers = {}, coordOverrides = {};
let selectedRegions = new Set();

function meterKey(m) { return (m.meter && String(m.meter).trim()) ? String(m.meter).trim() : 'ACC-' + String(m.account || '').trim(); }

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

document.getElementById('count').textContent = '(' + ALL_METERS.length + ')';

const regions = [...new Set(ALL_METERS.map(m => m.area).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ar'));
const regionOptions = document.getElementById('regionOptions');
const regionToggle = document.getElementById('regionToggle');
const regionMenu = document.getElementById('regionMenu');
regionOptions.innerHTML = regions.map(r => '<label class="region-option"><input type="checkbox" value="' + esc(r) + '" checked><span>' + esc(r) + '</span></label>').join('');
regions.forEach(r => selectedRegions.add(r));

function updateRegionLabel() {
  regionToggle.textContent = selectedRegions.size === regions.length ? '📍 كل المناطق' : selectedRegions.size === 0 ? '📍 لا توجد منطقة مختارة' : '📍 المناطق المختارة (' + selectedRegions.size + ')';
}
regionToggle.onclick = () => regionMenu.classList.toggle('open');
regionOptions.querySelectorAll('input').forEach(cb => cb.onchange = () => {
  cb.checked ? selectedRegions.add(cb.value) : selectedRegions.delete(cb.value);
  updateRegionLabel();
  applyFilter();
});
document.getElementById('selectAllRegions').onclick = () => {
  regions.forEach(r => selectedRegions.add(r));
  regionOptions.querySelectorAll('input').forEach(x => x.checked = true);
  updateRegionLabel();
  applyFilter();
};
document.getElementById('clearRegions').onclick = () => {
  selectedRegions.clear();
  regionOptions.querySelectorAll('input').forEach(x => x.checked = false);
  updateRegionLabel();
  applyFilter();
};
updateRegionLabel();

function hasCoords(m) { return !!(m.lat && m.lng); }

function icon(m, visited) {
  const s = latest[meterKey(m)]?.noteStatus;
  const fill = s === 'تم تحديثه' ? '#1d8a4a' : s === 'لم يتم تحديثه' ? '#c23b3b' : (m.meterStatus === 'ON' ? '#1d8a4a' : '#9e9e9e');
  const check = visited ? '<span style="position:absolute;top:-6px;right:-6px;width:14px;height:14px;border-radius:50%;background:#fff;color:#0f7a43;border:2px solid #0f7a43;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;line-height:1;">✓</span>' : '';
  return L.divIcon({
    className: '',
    html: '<div style="position:relative;width:20px;height:20px;"><div style="width:20px;height:20px;border-radius:50%;background:' + fill + ';border:2.5px solid #fff;box-shadow:0 1px 4px #0008"></div>' + check + '</div>',
    iconSize: [20, 20], iconAnchor: [10, 10]
  });
}

function rebuildMarkers() {
  Object.values(markers).forEach(mk => map.removeLayer(mk));
  markers = {};
  ALL_METERS.forEach(m => {
    if (!hasCoords(m)) return;
    const mk = L.marker([m.lat, m.lng], { icon: icon(m, false) }).addTo(map).on('click', () => openMeter(m));
    markers[meterKey(m)] = mk;
  });
  updateCounts();
  applyFilter();
}

function updateCounts() {
  const withCoords = ALL_METERS.filter(hasCoords);
  document.getElementById('allC').textContent = withCoords.length;
  document.getElementById('doneC').textContent = withCoords.filter(m => latest[meterKey(m)]?.noteStatus === 'تم تحديثه').length;
  document.getElementById('notC').textContent = withCoords.filter(m => latest[meterKey(m)]?.noteStatus === 'لم يتم تحديثه').length;
  document.getElementById('coordInfo').textContent = 'المعروض على الخريطة: ' + withCoords.length + ' من أصل ' + ALL_METERS.length;
  const missing = ALL_METERS.filter(m => !hasCoords(m));
  document.getElementById('missingCount').textContent = '(' + missing.length + ')';
}

async function loadLatest() {
  latest = {};
  coordOverrides = {};
  if (db) {
    try {
      const s = await db.collection('unupdated_meters_notes').get();
      s.forEach(d => { latest[d.id] = d.data(); });
    } catch (e) { console.warn(e); }
    try {
      const s2 = await db.collection('unupdated_coord_overrides').get();
      s2.forEach(d => { coordOverrides[d.id] = d.data(); });
    } catch (e) { console.warn(e); }
  } else {
    latest = JSON.parse(localStorage.getItem('unupdated_notes_latest') || '{}');
    coordOverrides = JSON.parse(localStorage.getItem('unupdated_coord_overrides') || '{}');
  }
  ALL_METERS.forEach(m => {
    const ov = coordOverrides[meterKey(m)];
    if (ov && ov.lat && ov.lng) {
      m.lat = ov.lat; m.lng = ov.lng; m.coordSource = 'مُلتقطة ميدانيًا';
    }
  });
  rebuildMarkers();
  renderMissingList();
}

function applyFilter() {
  ALL_METERS.forEach(m => {
    if (!hasCoords(m)) return;
    const s = latest[meterKey(m)]?.noteStatus;
    let show = selectedRegions.has(m.area);
    if (show) {
      if (statusFilter === 'done') show = s === 'تم تحديثه';
      else if (statusFilter === 'notdone') show = s === 'لم يتم تحديثه';
    }
    const mk = markers[meterKey(m)];
    if (!mk) return;
    if (show && !map.hasLayer(mk)) mk.addTo(map);
    if (!show && map.hasLayer(mk)) map.removeLayer(mk);
  });
}

document.querySelectorAll('.chip[data-f]').forEach(b => b.onclick = () => {
  document.querySelectorAll('.chip[data-f]').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  statusFilter = b.dataset.f;
  applyFilter();
});

function statusPill(s) {
  const on = s === 'Active';
  return '<span class="statusPill ' + (on ? 'on' : 'off') + '">' + esc(s || '—') + '</span>';
}

function meterMetaHtml(m) {
  let h = '';
  h += '<b>رقم الحساب:</b> ' + esc(m.account || '—') + '<br>';
  h += '<b>اسم العميل:</b> ' + esc(m.name || '—') + '<br>';
  h += '<b>فئة العميل:</b> ' + esc(m.class || '—') + '<br>';
  h += '<b>الفرع:</b> ' + esc(m.branch || '—') + ' — <b>المنطقة:</b> ' + esc(m.area || '—') + '<br>';
  h += '<b>رقم العداد:</b> ' + esc(m.meter || '—') + ' — <b>حالة العداد:</b> ' + esc(m.meterStatus || '—') + '<br>';
  h += '<b>متوسط الاستهلاك اليومي:</b> ' + esc(m.dailyAvg || '—') + '<br>';
  h += '<b>اشتراك الماء:</b> ' + statusPill(m.waterStatus) + ' (' + esc(m.waterClass || '—') + ')<br>';
  h += '<b>اشتراك الصرف:</b> ' + statusPill(m.sewerStatus) + ' (' + esc(m.sewerClass || '—') + ')<br>';
  h += '<b>الرصيد الحالي:</b> ' + esc(m.balance || '0') + ' — <b>رصيد التصفية:</b> ' + esc(m.payoff || '0') + '<br>';
  h += '<b>المبلغ المستحق:</b> ' + esc(m.due || '0') + ' — <b>آخر دفعة:</b> ' + esc(m.lastPay || '—') + '<br>';
  return h;
}

function openMeter(m) {
  current = m;
  document.getElementById('mTitle').textContent = esc(m.name || 'عداد ' + m.meter);
  let h = meterMetaHtml(m);
  const coord = hasCoords(m) ? (m.lat.toFixed(7) + ', ' + m.lng.toFixed(7) + (m.coordSource ? ' (' + esc(m.coordSource) + ')' : '')) : 'لا توجد إحداثيات';
  h += '<b>الإحداثيات:</b> ' + coord;
  document.getElementById('mMeta').innerHTML = h;

  const nav = document.getElementById('googleNav');
  if (hasCoords(m)) {
    nav.href = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(m.lat + ',' + m.lng);
    nav.style.display = 'block';
  } else {
    nav.style.display = 'none';
  }

  const key = meterKey(m);
  const x = latest[key];
  document.getElementById('noteStatus').value = x?.noteStatus || '';
  document.getElementById('noteText').value = '';
  document.getElementById('last').innerHTML = x
    ? '<div class="entry"><span class="badge ' + (x.noteStatus === 'تم تحديثه' ? 'done' : 'notdone') + '">' + esc(x.noteStatus) + '</span><br>' + esc(x.text || '') + '<br><small>' + esc(x.employee || '') + ' - ' + esc(x.createdAt || '') + '</small></div>'
    : '<div class="entry">لا يوجد تسجيل سابق</div>';
  document.getElementById('sheet').classList.add('open');
}

document.getElementById('close').onclick = () => document.getElementById('sheet').classList.remove('open');

document.getElementById('save').onclick = async () => {
  if (!current) return;
  const employee = document.getElementById('emp').value.trim();
  const noteStatus = document.getElementById('noteStatus').value;
  const text = document.getElementById('noteText').value.trim();
  if (!employee) { alert('اكتب اسم الموظف أولاً'); return; }
  if (!noteStatus) { alert('اختر تم تحديثه أو لم يتم تحديثه'); return; }
  const key = meterKey(current);
  const now = Date.now();
  const rec = {
    meter: current.meter, account: current.account, name: current.name, branch: current.branch, area: current.area,
    noteStatus, text, employee,
    createdAt: new Date(now).toLocaleString('ar-SA'), createdAtMs: now, updatedAtMs: now
  };
  try {
    if (db) await db.collection('unupdated_meters_notes').doc(key).set(rec, { merge: true });
    latest[key] = rec;
    if (!db) localStorage.setItem('unupdated_notes_latest', JSON.stringify(latest));
    document.getElementById('msg').textContent = 'تم الحفظ ✓';
    openMeter(current);
    rebuildMarkers();
  } catch (e) { alert('تعذر الحفظ: ' + e.message); }
};

/* ============ MISSING-COORDINATES PANEL ============ */
function renderMissingList() {
  const wrap = document.getElementById('missingList');
  const missing = ALL_METERS.filter(m => !hasCoords(m));
  if (!missing.length) { wrap.innerHTML = '<div style="text-align:center;color:#889;padding:20px">🎉 كل العدادات صار عندها إحداثيات</div>'; return; }
  wrap.innerHTML = missing.map((m) => {
    const key = meterKey(m);
    return '<div class="missRow" data-key="' + esc(key) + '">' +
      '<div class="nm">' + esc(m.name || 'بدون اسم') + '</div>' +
      '<div class="sub">' + meterMetaHtml(m) + '</div>' +
      '<button data-idx="' + ALL_METERS.indexOf(m) + '">📍 استخدم موقعي الآن</button>' +
    '</div>';
  }).join('');
  wrap.querySelectorAll('button[data-idx]').forEach(b => b.onclick = () => captureCoordsFor(+b.dataset.idx, b));
}

function captureCoordsFor(idx, btnEl) {
  if (!navigator.geolocation) { alert('المتصفح لا يدعم تحديد الموقع'); return; }
  btnEl.disabled = true; btnEl.textContent = '⏳ جاري تحديد موقعك...';
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const m = ALL_METERS[idx];
    const lat = pos.coords.latitude, lng = pos.coords.longitude;
    const key = meterKey(m);
    const employee = document.getElementById('emp').value.trim() || 'غير معروف';
    const now = Date.now();
    const rec = { meter: m.meter, account: m.account, lat, lng, employee, capturedAt: new Date(now).toLocaleString('ar-SA'), capturedAtMs: now };
    try {
      if (db) await db.collection('unupdated_coord_overrides').doc(key).set(rec, { merge: true });
      coordOverrides[key] = rec;
      if (!db) localStorage.setItem('unupdated_coord_overrides', JSON.stringify(coordOverrides));
      m.lat = lat; m.lng = lng; m.coordSource = 'مُلتقطة ميدانيًا';
      btnEl.closest('.missRow').classList.add('captured');
      btnEl.textContent = '✓ تم تسجيل الموقع';
      rebuildMarkers();
      renderMissingList();
    } catch (e) {
      alert('تعذر الحفظ: ' + e.message);
      btnEl.disabled = false; btnEl.textContent = '📍 استخدم موقعي الآن';
    }
  }, (err) => {
    alert('تعذر تحديد موقعك: ' + err.message);
    btnEl.disabled = false; btnEl.textContent = '📍 استخدم موقعي الآن';
  }, { enableHighAccuracy: true, timeout: 20000 });
}

document.getElementById('missingBtn').onclick = () => {
  document.getElementById('missingPanel').classList.add('open');
  renderMissingList();
};
document.getElementById('closeMissing').onclick = () => document.getElementById('missingPanel').classList.remove('open');

/* ============ REPORT EXPORT (all fields, including missing-coordinate rows) ============ */
document.getElementById('reportBtn').onclick = async () => {
  const btn = document.getElementById('reportBtn');
  const old = btn.textContent; btn.disabled = true; btn.textContent = '⏳ جاري التجهيز...';
  try {
    await loadLatest();
    const rows = ALL_METERS.map(m => {
      const r = latest[meterKey(m)] || {};
      return {
        'ACCOUNT ID': m.account || '', 'CUSTOMER NAME': m.name || '', 'CUSTOMER CLASS': m.class || '',
        'الفرع': m.branch || '', 'المنطقة': m.area || '', 'METER ID': m.meter || '', 'METER STATUS': m.meterStatus || '',
        'DAILY AVERAGE': m.dailyAvg || '', 'WATER SA CLASS': m.waterClass || '', 'WATER SA STATUS': m.waterStatus || '',
        'SEWER SA CLASS': m.sewerClass || '', 'SEWER SA STATUS': m.sewerStatus || '',
        'CURRENT BALANCE': m.balance || '', 'PAYOFF BALANCE': m.payoff || '', 'DUE AMOUNT': m.due || '', 'LAST PAYMENT': m.lastPay || '',
        'LATITUDE': m.lat || '', 'LONGITUDE': m.lng || '', 'مصدر الإحداثيات': m.coordSource || 'لا يوجد',
        'حالة المتابعة': r.noteStatus || '', 'ملاحظات الموظف': r.text || '', 'اسم الموظف': r.employee || '', 'تاريخ التسجيل': r.createdAt || ''
      };
    });
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'العدادات غير المحدثة');
    const now = new Date();
    const stamp = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
    XLSX.writeFile(wb, 'Unupdated_Meters_Report_' + rows.length + '_' + stamp + '.xlsx');
  } catch (e) { alert('تعذر إنشاء التقرير: ' + e.message); }
  finally { btn.disabled = false; btn.textContent = old; }
};

const q = document.getElementById('q'), res = document.getElementById('results');
q.oninput = () => {
  const v = q.value.trim();
  if (!v) { res.style.display = 'none'; return; }
  const a = ALL_METERS.filter(m => (m.meter + ' ' + m.account + ' ' + m.area + ' ' + m.branch + ' ' + m.name).includes(v)).slice(0, 50);
  res.innerHTML = a.map((m) => {
    const tag = hasCoords(m) ? '' : '<span class="tag" style="background:#a15b1f">بدون إحداثيات</span>';
    return '<div class="item" data-i="' + ALL_METERS.indexOf(m) + '"><b>' + esc(m.meter) + '</b>' + tag + '<br><small>' + esc(m.branch) + ' / ' + esc(m.area) + ' — حساب ' + esc(m.account) + '</small></div>';
  }).join('') || '<div class="item">لا توجد نتائج</div>';
  res.style.display = 'block';
  res.querySelectorAll('[data-i]').forEach(x => x.onclick = () => {
    const m = ALL_METERS[+x.dataset.i];
    res.style.display = 'none';
    q.value = '';
    if (hasCoords(m)) map.setView([m.lat, m.lng], 18);
    openMeter(m);
  });
};

loadLatest();

/* ============ LIVE LOCATION TRACKING (continuous "you are here" dot) ============ */
let watchId = null;
let liveMarker = null;
let followMe = true;

function liveIcon(){
  return L.divIcon({
    className:'',
    html:'<div class="live-dot-wrap"><div class="live-dot-pulse"></div><div class="live-dot-core"></div></div>',
    iconSize:[26,26], iconAnchor:[13,13]
  });
}

function onPosition(pos){
  const latlng = [pos.coords.latitude, pos.coords.longitude];
  if(!liveMarker){
    liveMarker = L.marker(latlng, { icon: liveIcon(), zIndexOffset: 1000 }).addTo(map);
  } else {
    liveMarker.setLatLng(latlng);
  }
  if(followMe) map.setView(latlng, Math.max(map.getZoom(), 16));
}

function onPositionError(err){
  alert('تعذر تحديد موقعك، تأكد من تفعيل خدمة الموقع. (' + (err.message || '') + ')');
  stopTracking();
}

function startTracking(){
  if(!navigator.geolocation){ alert('المتصفح لا يدعم تحديد الموقع'); return; }
  followMe = true;
  watchId = navigator.geolocation.watchPosition(onPosition, onPositionError, {
    enableHighAccuracy:true, maximumAge:2000, timeout:15000
  });
  document.getElementById('locateBtn').classList.add('tracking');
}

function stopTracking(){
  if(watchId !== null){ navigator.geolocation.clearWatch(watchId); watchId = null; }
  document.getElementById('locateBtn').classList.remove('tracking');
}

document.getElementById('locateBtn').addEventListener('click', () => {
  if(watchId === null) startTracking(); else stopTracking();
});

map.on('dragstart', () => { if(watchId !== null) followMe = false; });
</script>
