function sha(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')})}

function check(){sha('vay-salt-'+document.getElementById('gpw').value).then(function(h){if(h===H)ok();else{document.getElementById('gerr').textContent='الرمز غير صحيح';document.getElementById('gpw').value=''}})}

document.getElementById('gpw').addEventListener('keydown',function(e){if(e.key==='Enter')check()});
})();

async function loadLatest(){latest={};if(db){try{let s=await db.collection('dummy_meter_updates').get();s.forEach(d=>{let x=d.data();let k=meterKey(x);let t=Number(x.updatedAtMs||x.createdAtMs||0);let old=latest[k];let ot=Number(old?.updatedAtMs||old?.createdAtMs||0);if(!old||t>ot||(t===ot&&d.id>(old._docId||''))){x._docId=d.id;latest[k]=x}})}catch(e){console.warn(e)}}else{latest=JSON.parse(localStorage.getItem('rabie_notes_latest')||'{}')}refresh()}
function refresh(){valid.forEach(m=>{let s=latest[meterKey(m)]?.noteStatus;if(markers[meterKey(m)])markers[meterKey(m)].setIcon(icon(s,!!latest[meterKey(m)]))});applyFilter()}
function applyFilter(){valid.forEach(m=>{let mk=markers[meterKey(m)];if(!mk)return;let show=selectedRegions.has(m.region);if(show&&!map.hasLayer(mk))mk.addTo(map);if(!show&&map.hasLayer(mk))map.removeLayer(mk)})}

function openMeter(m){current=m;document.getElementById('mTitle').textContent='عداد '+(m.meter||'بدون رقم عداد');let coord=m.lat&&m.lng?(m.lat.toFixed(7)+', '+m.lng.toFixed(7)):'لا توجد إحداثيات صالحة';document.getElementById('mMeta').innerHTML='<b>المنطقة:</b> '+esc(m.region||'—')+'<br><b>رقم العداد:</b> '+esc(m.meter||'—')+'<br><b>حالة العداد:</b> '+esc(m.status||'—')+'<br><b>الاستهلاك:</b> '+esc(m.consumption||'—')+'<br><b>المصدر:</b> '+esc(m.source||'—')+'<br><b>الإحداثيات المستخدمة:</b> '+esc(coord)+(m.coordSource?' <small>('+esc(m.coordSource)+')</small>':'');document.getElementById('coordCapture').style.display=(m.lat&&m.lng)?'none':'block';let nav=document.getElementById('googleNav');if(m.lat&&m.lng){nav.href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(m.lat+','+m.lng);nav.style.display='block'}else{nav.removeAttribute('href');nav.style.display='none'}let key=meterKey(m);let x=latest[key];document.getElementById('noteStatus').value=x?.noteStatus||'';document.getElementById('noteText').value='';document.getElementById('last').innerHTML=x?'<div class="entry"><span class="badge '+(x.noteStatus==='تم تحديثه'?'done':'notdone')+'">'+x.noteStatus+'</span><br>'+esc(x.text||'')+(x.photo?'<br><img src="'+x.photo+'" style="max-width:100%;max-height:160px;border-radius:8px;margin-top:6px">':'')+'<br><small>'+esc(x.employee||'')+' - '+esc(x.createdAt||'')+'</small></div>':'<div class="entry">لا يوجد تسجيل سابق</div>';resetPhoto();document.getElementById('sheet').classList.add('open')}
document.getElementById('close').onclick=()=>document.getElementById('sheet').classList.remove('open');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('reportBtn').onclick=async()=>{
  const btn=document.getElementById('reportBtn');
  const old=btn.textContent; btn.disabled=true; btn.textContent='⏳ جاري تجهيز التقرير...';
  try{
    await loadLatest();
    const reportMeters=valid.filter(m=>{
      const id=String(m.meter||'').trim();
      return id && id.toLowerCase()!=='nan' && id!=='#N/A' && id!=='0' && selectedRegions.has(m.region);
    });
    const rows=reportMeters.map(m=>{
      const r=latest[meterKey(m)]||{};
      return {
        'METER ID':m.meter||'',
        'المنطقة':m.region||'',
        'حالة العداد':m.status||'',
        'الاستهلاك':m.consumption||'',
        'المصدر':m.source||'',
        'LATITUDE':m.lat||'',
        'LONGITUDE':m.lng||'',
        'مصدر الإحداثيات':m.coordSource||'',
        'حالة التحديث':r.noteStatus||'',
        'ملاحظات الموظف':r.text||'',
        'اسم الموظف':r.employee||'',
        'تاريخ ووقت التسجيل':r.createdAt||''
      };
    });
    const photos=reportMeters.map(m=>latest[meterKey(m)]||{});
    const HEAD=['METER ID','المنطقة','حالة العداد','الاستهلاك','المصدر','LATITUDE','LONGITUDE','مصدر الإحداثيات','حالة التحديث','ملاحظات الموظف','اسم الموظف','تاريخ ووقت التسجيل'];
    const WID=[16,14,18,12,12,14,14,20,16,35,20,24,24];
    const wb=new ExcelJS.Workbook();
    const items=rows.map((row,i)=>({row:row,rec:photos[i]}));
    const build=(name,list)=>{
      const ws=wb.addWorksheet(name,{views:[{rightToLeft:true}]});
      ws.columns=HEAD.concat(['الصورة']).map((h,i)=>({header:h,key:'c'+i,width:WID[i]}));
      const hr=ws.getRow(1);hr.font={bold:true,color:{argb:'FFFFFFFF'}};hr.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF0B3D3D'}};hr.alignment={vertical:'middle',horizontal:'center'};
      list.forEach(it=>{
        const wr=ws.addRow(HEAD.map(h=>it.row[h]));
        wr.alignment={vertical:'middle',wrapText:true};
        if(it.rec&&it.rec.photo){
          wr.height=95;
          const id=wb.addImage({base64:String(it.rec.photo).split(',')[1],extension:'jpeg'});
          const w0=it.rec.photoW||4,h0=it.rec.photoH||3,k=Math.min(130/w0,90/h0);
          ws.addImage(id,{tl:{col:12,row:wr.number-1},ext:{width:Math.round(w0*k),height:Math.round(h0*k)}});
        }
      });
    };
    build('تقرير العدادات',items);
    build('بدون إحداثيات',items.filter(it=>!it.row['LATITUDE']||!it.row['LONGITUDE']));
    const now=new Date();
    const stamp=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
    const buf=await wb.xlsx.writeBuffer();
    const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='RabieAlBakr_Report_'+reportMeters.length+'_'+stamp+'.xlsx';document.body.appendChild(link);link.click();setTimeout(()=>{URL.revokeObjectURL(link.href);link.remove()},5000);
  }catch(e){alert('تعذر إنشاء التقرير: '+e.message)}
  finally{btn.disabled=false;btn.textContent=old}
};
let photoData=null,photoW=0,photoH=0;
function resetPhoto(){photoData=null;photoW=0;photoH=0;document.getElementById('photoInput').value='';document.getElementById('photoPrev').innerHTML=''}
function compressImage(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej(new Error('تعذر قراءة الصورة'));fr.onload=()=>{const img=new Image();img.onerror=()=>rej(new Error('صيغة الصورة غير مدعومة'));img.onload=()=>{const M=800;let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,M/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);let q=.6,d=c.toDataURL('image/jpeg',q);while(d.length>400000&&q>.3){q-=.1;d=c.toDataURL('image/jpeg',q)}res({data:d,w:w,h:h})};img.src=fr.result};fr.readAsDataURL(file)})}
document.getElementById('photoInput').onchange=async e=>{const f=e.target.files[0];const p=document.getElementById('photoPrev');if(!f){resetPhoto();return}p.textContent='⏳ جاري تجهيز الصورة...';try{const r=await compressImage(f);photoData=r.data;photoW=r.w;photoH=r.h;p.innerHTML='<img src="'+photoData+'"><button type="button" id="photoRemove">🗑 حذف الصورة</button>';document.getElementById('photoRemove').onclick=resetPhoto}catch(err){resetPhoto();alert(err.message)}};
document.getElementById('save').onclick=async()=>{if(!current)return;let employee=document.getElementById('emp').value.trim(),noteStatus=document.getElementById('noteStatus').value,text=document.getElementById('noteText').value.trim();if(!employee){alert('اكتب اسم الموظف أولاً');return}if(!noteStatus){alert('اختر تم تحديثه أو لم يتم تحديثه');return}let key=meterKey(current);let now=Date.now();let rec={meter:current.meter,meterStatus:current.status,consumption:current.consumption,source:current.source,region:current.region,x:current.x,y:current.y,lat:current.lat,lng:current.lng,coordSource:current.coordSource,noteStatus,text,employee,photo:photoData||latest[key]?.photo||'',photoW:photoData?photoW:(latest[key]?.photoW||0),photoH:photoData?photoH:(latest[key]?.photoH||0),createdAt:new Date(now).toLocaleString('ar-SA'),createdAtMs:now,updatedAtMs:now};try{if(db)await db.collection('dummy_meter_updates').doc(key).set(rec,{merge:true});latest[key]=rec;if(!db)localStorage.setItem('rabie_notes_latest',JSON.stringify(latest));document.getElementById('msg').textContent='تم الحفظ ✓';openMeter(current);refresh()}catch(e){alert('تعذر الحفظ: '+e.message)}};
const q=document.getElementById('q'),res=document.getElementById('results');q.oninput=()=>{let v=q.value.trim();if(!v){res.style.display='none';return}let a=valid.filter(m=>(m.meter+' '+m.status+' '+m.source+' '+m.region).includes(v)).slice(0,50);res.innerHTML=a.map((m,i)=>'<div class="item" data-i="'+valid.indexOf(m)+'"><b>'+m.meter+'</b> — '+m.status+'<br><small>'+m.region+' | '+(latest[meterKey(m)]?.noteStatus||'غير مسجل')+'</small></div>').join('')||'<div class="item">لا توجد نتائج</div>';res.style.display='block';res.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{let m=valid[+x.dataset.i];res.style.display='none';q.value='';if(m.lat&&m.lng)map.setView([m.lat,m.lng],18);openMeter(m)})};

document.getElementById('saveCoord').onclick=()=>{if(!current)return;if(!navigator.geolocation){alert('الجهاز لا يدعم تحديد الموقع');return}let b=document.getElementById('saveCoord');b.disabled=true;b.textContent='⏳ جاري تحديد الموقع...';navigator.geolocation.getCurrentPosition(async p=>{let lat=p.coords.latitude,lng=p.coords.longitude,acc=p.coords.accuracy;current.lat=lat;current.lng=lng;current.y=lat;current.x=lng;current.coordSource='موقع الموظف GPS';let key=meterKey(current);let old=latest[key]||{};let now=Date.now();let rec={...old,meter:current.meter,meterStatus:current.status,consumption:current.consumption,source:current.source,region:current.region,x:lng,y:lat,lat,lng,coordSource:'موقع الموظف GPS',gpsAccuracy:acc,coordinateEmployee:document.getElementById('emp').value.trim(),coordinateUpdatedAt:new Date(now).toLocaleString('ar-SA'),updatedAtMs:now};try{if(db)await db.collection('dummy_meter_updates').doc(key).set(rec,{merge:true});latest[key]=rec;if(!markers[key])markers[key]=L.marker([lat,lng],{icon:icon(rec.noteStatus, true)}).addTo(map).on('click',()=>openMeter(current));map.setView([lat,lng],18);document.getElementById('coordInfo').textContent='الإجمالي: '+valid.length+' | بدون إحداثيات: '+valid.filter(m=>!m.lat||!m.lng).length;openMeter(current);alert('تم حفظ إحداثيات العداد ✓')}catch(e){alert('تعذر حفظ الإحداثيات: '+e.message)}finally{b.disabled=false;b.textContent='📍 حفظ موقعي الحالي لهذا العداد'}},e=>{alert('تعذر تحديد الموقع: '+e.message);b.disabled=false;b.textContent='📍 حفظ موقعي الحالي لهذا العداد'},{enableHighAccuracy:true,timeout:20000,maximumAge:0})};

/* ============ LIVE LOCATION TRACKING (continuous "you are here" dot) ============ */
let watchId = null;
let liveMarker = null;
let followMe = true;

function liveIcon(){
  return L.divIcon({
    className:'',
    html:'<div class="live-dot-wrap"><div class="live-dot-pulse"></div><div class="live-dot-core"></div></div>',
    iconSize:[26,26], iconAnchor:[13,13]
  });
}

function onPosition(pos){
  const latlng = [pos.coords.latitude, pos.coords.longitude];
  if(!liveMarker){
    liveMarker = L.marker(latlng, { icon: liveIcon(), zIndexOffset: 1000 }).addTo(map);
  } else {
    liveMarker.setLatLng(latlng);
  }
  if(followMe) map.setView(latlng, Math.max(map.getZoom(), 16));
}

function onPositionError(err){
  alert('تعذر تحديد موقعك، تأكد من تفعيل خدمة الموقع. (' + (err.message || '') + ')');
  stopTracking();
}

function startTracking(){
  if(!navigator.geolocation){ alert('المتصفح لا يدعم تحديد الموقع'); return; }
  followMe = true;
  watchId = navigator.geolocation.watchPosition(onPosition, onPositionError, {
    enableHighAccuracy:true, maximumAge:2000, timeout:15000
  });
  document.getElementById('locateBtn').classList.add('tracking');
}

function stopTracking(){
  if(watchId !== null){ navigator.geolocation.clearWatch(watchId); watchId = null; }
  document.getElementById('locateBtn').classList.remove('tracking');
}

document.getElementById('locateBtn').addEventListener('click', () => {
  if(watchId === null) startTracking(); else stopTracking();
});

map.on('dragstart', () => { if(watchId !== null) followMe = false; });
</script></body></html>
