const firebaseConfig={apiKey:"AIzaSyCdB47KCQ_8cnUOYYFZNcPWvvpBQ_NKg6w",authDomain:"meters-notes.firebaseapp.com",projectId:"meters-notes",storageBucket:"meters-notes.firebasestorage.app",messagingSenderId:"404869981230",appId:"1:404869981230:web:410b19374c14fb6dd1abbf"};

const map=L.map('map').setView([26.05,40.65],10);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'Esri'}).addTo(map);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:20}).addTo(map);
let current=null,filter='all',latest={},markers={};const valid=METERS.filter(m=>m.lat&&m.lng);document.getElementById('count').textContent='('+METERS.length+')';document.getElementById('allC').textContent=METERS.length;document.getElementById('coordInfo').textContent='على الخريطة: '+valid.length+' | بدون إحداثيات: '+(METERS.length-valid.length);
function icon(s){let c=s==='تم تحديثه'?'#1d8a4a':s==='لم يتم تحديثه'?'#c23b3b':'#d97b1f';return L.divIcon({className:'',html:'<div style="width:22px;height:22px;border-radius:50%;background:'+c+';border:3px solid white;box-shadow:0 1px 5px #0008"></div>',iconSize:[22,22],iconAnchor:[11,11]})}
valid.forEach(m=>{let mk=L.marker([m.lat,m.lng],{icon:icon(null)}).addTo(map).on('click',()=>openMeter(m));markers[m.meter]=mk});
async function loadLatest(){latest={};if(db){try{let s=await db.collection('dummy_notes').get();s.forEach(d=>{let x=d.data();if(!latest[x.meter]||String(x.createdAt||'')>String(latest[x.meter].createdAt||''))latest[x.meter]=x})}catch(e){console.warn(e)}}else{latest=JSON.parse(localStorage.getItem('dummy_notes_latest')||'{}')}refresh()}
function refresh(){let d=0,n=0;METERS.forEach(m=>{let s=(latest[m.meter||('ACC-'+m.account)]||latest[m.meter])?.noteStatus;if(s==='تم تحديثه')d++;else if(s==='لم يتم تحديثه')n++;if(markers[m.meter])markers[m.meter].setIcon(icon(s))});document.getElementById('doneC').textContent=d;document.getElementById('notC').textContent=n;document.getElementById('noneC').textContent=METERS.length-d-n;applyFilter()}
function applyFilter(){valid.forEach(m=>{let s=(latest[m.meter||('ACC-'+m.account)]||latest[m.meter])?.noteStatus;let show=filter==='all'||s===filter||(filter==='none'&&!s);let mk=markers[m.meter];if(show&&!map.hasLayer(mk))mk.addTo(map);if(!show&&map.hasLayer(mk))map.removeLayer(mk)})}
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;applyFilter()});
function openMeter(m){current=m;document.getElementById('mTitle').textContent='عداد '+(m.meter||'بدون رقم عداد');let coord=m.lat&&m.lng?(m.lat.toFixed(7)+', '+m.lng.toFixed(7)):'لا توجد إحداثيات صالحة';document.getElementById('mMeta').innerHTML='<b>رقم الحساب:</b> '+esc(m.account)+'<br><b>اسم العميل:</b> '+esc(m.name)+'<br><b>الفرع:</b> '+esc(m.branch)+'<br><b>فئة العميل:</b> '+esc(m.class)+'<br><b>رقم العداد:</b> '+esc(m.meter||'—')+'<br><b>حالة العداد:</b> '+esc(m.status||'—')+'<br><b>X:</b> '+esc(m.x||'—')+'<br><b>Y:</b> '+esc(m.y||'—')+'<br><b>XYZ:</b> '+esc(m.xyz||'—')+'<br><b>الإحداثيات المستخدمة:</b> '+esc(coord)+(m.coordSource?' <small>('+esc(m.coordSource)+')</small>':'');let key=m.meter||('ACC-'+m.account);let x=latest[key]||latest[m.meter];document.getElementById('noteStatus').value=x?.noteStatus||'';document.getElementById('noteText').value='';document.getElementById('last').innerHTML=x?'<div class="entry"><span class="badge '+(x.noteStatus==='تم تحديثه'?'done':'notdone')+'">'+x.noteStatus+'</span><br>'+esc(x.text||'')+'<br><small>'+esc(x.employee||'')+' - '+esc(x.createdAt||'')+'</small></div>':'<div class="entry">لا يوجد تسجيل سابق</div>';document.getElementById('sheet').classList.add('open')}
document.getElementById('close').onclick=()=>document.getElementById('sheet').classList.remove('open');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('save').onclick=async()=>{if(!current)return;let employee=document.getElementById('emp').value.trim(),noteStatus=document.getElementById('noteStatus').value,text=document.getElementById('noteText').value.trim();if(!employee){alert('اكتب اسم الموظف أولاً');return}if(!noteStatus){alert('اختر تم تحديثه أو لم يتم تحديثه');return}let key=current.meter||('ACC-'+current.account);let rec={meter:current.meter,account:current.account,name:current.name,branch:current.branch,customerClass:current.class,meterStatus:current.status,x:current.x,y:current.y,xyz:current.xyz,lat:current.lat,lng:current.lng,coordSource:current.coordSource,noteStatus,text,employee,createdAt:new Date().toLocaleString('ar-SA')};try{if(db)await db.collection('dummy_notes').add(rec);latest[key]=rec;if(!db)localStorage.setItem('dummy_notes_latest',JSON.stringify(latest));document.getElementById('msg').textContent='تم الحفظ ✓';openMeter(current);refresh()}catch(e){alert('تعذر الحفظ: '+e.message)}};
const q=document.getElementById('q'),res=document.getElementById('results');q.oninput=()=>{let v=q.value.trim();if(!v){res.style.display='none';return}let a=METERS.filter(m=>(m.meter+' '+m.account+' '+m.branch+' '+m.name).includes(v)).slice(0,50);res.innerHTML=a.map((m,i)=>'<div class="item" data-i="'+METERS.indexOf(m)+'"><b>'+m.meter+'</b> — '+m.branch+'<br><small>الحساب '+m.account+' | '+(latest[m.meter]?.noteStatus||'غير مسجل')+'</small></div>').join('')||'<div class="item">لا توجد نتائج</div>';res.style.display='block';res.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{let m=METERS[+x.dataset.i];res.style.display='none';q.value='';if(m.lat&&m.lng)map.setView([m.lat,m.lng],18);openMeter(m)})};
