const map=L.map('map').setView([26.05,40.65],10);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'Esri'}).addTo(map);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:20}).addTo(map);
let current=null,selectedRegions=new Set(),latest={},markers={};
function meterKey(m){return String(m.meter||'').trim();}const valid=METERS.filter(m=>m.lat&&m.lng&&m.meter&&String(m.meter).trim());document.getElementById('count').textContent='('+valid.length+')';document.getElementById('coordInfo').textContent='الإجمالي: '+valid.length;const regions=[...new Set(valid.map(m=>m.region).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'));const regionOptions=document.getElementById('regionOptions'),regionToggle=document.getElementById('regionToggle'),regionMenu=document.getElementById('regionMenu');regionOptions.innerHTML=regions.map(r=>'<label class="region-option"><input type="checkbox" value="'+esc(r)+'" checked><span>'+esc(r)+'</span></label>').join('');regions.forEach(r=>selectedRegions.add(r));function updateRegionLabel(){regionToggle.textContent=selectedRegions.size===regions.length?'📍 كل المناطق':selectedRegions.size===0?'📍 لا توجد منطقة مختارة':'📍 المناطق المختارة ('+selectedRegions.size+')'}regionToggle.onclick=()=>regionMenu.classList.toggle('open');regionOptions.querySelectorAll('input').forEach(cb=>cb.onchange=()=>{cb.checked?selectedRegions.add(cb.value):selectedRegions.delete(cb.value);updateRegionLabel();applyFilter()});document.getElementById('selectAllRegions').onclick=()=>{regions.forEach(r=>selectedRegions.add(r));regionOptions.querySelectorAll('input').forEach(x=>x.checked=true);updateRegionLabel();applyFilter()};document.getElementById('clearRegions').onclick=()=>{selectedRegions.clear();regionOptions.querySelectorAll('input').forEach(x=>x.checked=false);updateRegionLabel();applyFilter()};updateRegionLabel();
function icon(s,visited=false){let c=s==='تم تحديثه'?'#1d8a4a':s==='لم يتم تحديثه'?'#c23b3b':'#d97b1f';let check=visited?'<span class="visited-check">✓</span>':'';return L.divIcon({className:'',html:'<div class="meter-dot-wrap"><div style="width:22px;height:22px;border-radius:50%;background:'+c+';border:3px solid white;box-shadow:0 1px 5px #0008"></div>'+check+'</div>',iconSize:[22,22],iconAnchor:[11,11]})}
valid.forEach(m=>{let mk=L.marker([m.lat,m.lng],{icon:icon(null)}).addTo(map).on('click',()=>openMeter(m));markers[meterKey(m)]=mk});
async function loadLatest(){latest={};if(db){try{let s=await db.collection('dummy_meter_updates').get();s.forEach(d=>{let x=d.data();let k=meterKey(x);let t=Number(x.updatedAtMs||x.createdAtMs||0);let old=latest[k];let ot=Number(old?.updatedAtMs||old?.createdAtMs||0);if(!old||t>ot||(t===ot&&d.id>(old._docId||''))){x._docId=d.id;latest[k]=x}})}catch(e){console.warn(e)}}else{latest=JSON.parse(localStorage.getItem('dummy_notes_latest')||'{}')}refresh()}
function refresh(){valid.forEach(m=>{let s=latest[meterKey(m)]?.noteStatus;if(markers[meterKey(m)])markers[meterKey(m)].setIcon(icon(s,!!latest[meterKey(m)]))});applyFilter()}
function applyFilter(){valid.forEach(m=>{let show=selectedRegions.has(m.region);let mk=markers[meterKey(m)];if(show&&!map.hasLayer(mk))mk.addTo(map);if(!show&&map.hasLayer(mk))map.removeLayer(mk)})}

function openMeter(m){current=m;document.getElementById('mTitle').textContent='عداد '+(m.meter||'بدون رقم عداد');let coord=m.lat&&m.lng?(m.lat.toFixed(7)+', '+m.lng.toFixed(7)):'لا توجد إحداثيات صالحة';document.getElementById('mMeta').innerHTML='<b>المنطقة:</b> '+esc(m.region||'—')+'<br><b>رقم الحساب:</b> '+esc(m.account||'—')+'<br><b>اسم العميل:</b> '+esc(m.name||'—')+'<br><b>الفرع:</b> '+esc(m.branch||'—')+'<br><b>فئة العميل:</b> '+esc(m.class||'—')+'<br><b>رقم العداد:</b> '+esc(m.meter||'—')+'<br><b>حالة العداد:</b> '+esc(m.status||'—')+'<br><b>X:</b> '+esc(m.x||'—')+'<br><b>Y:</b> '+esc(m.y||'—')+'<br><b>XYZ:</b> '+esc(m.xyz||'—')+'<br><b>الإحداثيات المستخدمة:</b> '+esc(coord)+(m.coordSource?' <small>('+esc(m.coordSource)+')</small>':'');let nav=document.getElementById('googleNav');if(m.lat&&m.lng){nav.href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(m.lat+','+m.lng);nav.style.display='block'}else{nav.removeAttribute('href');nav.style.display='none'}let key=meterKey(m);let x=latest[key];document.getElementById('noteStatus').value=x?.noteStatus||'';document.getElementById('noteText').value='';document.getElementById('last').innerHTML=x?'<div class="entry"><span class="badge '+(x.noteStatus==='تم تحديثه'?'done':'notdone')+'">'+x.noteStatus+'</span><br>'+esc(x.text||'')+'<br><small>'+esc(x.employee||'')+' - '+esc(x.createdAt||'')+'</small></div>':'<div class="entry">لا يوجد تسجيل سابق</div>';document.getElementById('sheet').classList.add('open')}
document.getElementById('close').onclick=()=>document.getElementById('sheet').classList.remove('open');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('reportBtn').onclick=async()=>{
  const btn=document.getElementById('reportBtn');
  const old=btn.textContent; btn.disabled=true; btn.textContent='⏳ جاري تجهيز التقرير...';
  try{
    await loadLatest();
    const reportMeters=valid.filter(m=>{
      const id=String(m.meter||'').trim();
      return id && id.toLowerCase()!=='nan' && id!=='#N/A' && id!=='0' && selectedRegions.has(m.region);
    });
    const rows=reportMeters.map(m=>{
      const r=latest[meterKey(m)]||{};
      return {
        'ACCOUNT ID':m.account||'',
        'CUSTOMER NAME':m.name||'',
        'BRANCH NAME':m.branch||'',
        'CUSTOMER CLASS':m.class||'',
        'المنطقة':m.region||'',
        'METER ID':m.meter||'',
        'METER STATUS':m.status||'',
        'X':m.x||'',
        'Y':m.y||'',
        'XYZ':m.xyz||'',
        'LATITUDE':m.lat||'',
        'LONGITUDE':m.lng||'',
        'مصدر الإحداثيات':m.coordSource||'',
        'حالة التحديث':r.noteStatus||'',
        'ملاحظات الموظف':r.text||'',
        'اسم الموظف':r.employee||'',
        'تاريخ ووقت التسجيل':r.createdAt||''
      };
    });
    const ws=XLSX.utils.json_to_sheet(rows);
    ws['!cols']=[{wch:16},{wch:30},{wch:16},{wch:16},{wch:14},{wch:20},{wch:18},{wch:14},{wch:16},{wch:16},{wch:28},{wch:16},{wch:16},{wch:18},{wch:18},{wch:35},{wch:20},{wch:24}];
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'تقرير العدادات');
    const now=new Date();
    const stamp=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
    XLSX.writeFile(wb,'DUMMY_FreeHours_Report_'+reportMeters.length+'_'+stamp+'.xlsx');
  }catch(e){alert('تعذر إنشاء التقرير: '+e.message)}
  finally{btn.disabled=false;btn.textContent=old}
};
